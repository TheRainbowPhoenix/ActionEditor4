name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed to build browser/aquedi4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install browser dependencies
        working-directory: ./browser
        run: npm install

      - name: Build Aquedi4
        working-directory: ./browser
        run: npm run build:engine

      - name: Copy Aquedi4 runtime files
        run: |
          for dir in bmp core data libs loaders managers parsers plugins scenes ui; do
            cp -a "browser/aquedi4/$dir" browser/aquedi4/dist/
          done

      # Assemble everything that should appear on GitHub Pages.
      - name: Prepare Pages directory
        run: |
          mkdir -p _site

          # Existing site -> /ActionEditor4/
          cp -a original/blog/. _site/

          # Aquedi4 -> /ActionEditor4/game/
          mkdir -p _site/game
          cp -a browser/aquedi4/dist/. _site/game/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4